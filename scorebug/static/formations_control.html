<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VolleyScore Formations Control</title>
  <link rel="icon" type="image/x-icon" href="/static/icon.ico">
  <style>
    body { font-family: Arial, sans-serif; background:#222; color:#fff; padding:15px; margin: 0; }
    h1 { text-align:center; font-size: 1.5rem; }
    .section { margin-bottom:20px; padding:10px; background:#333; border-radius:6px; }
    label { display:block; margin-bottom:5px; color:#ccc; }
    input[type="text"], input[type="password"], button {
      width:100%;
      padding:10px;
      margin-bottom:10px;
      border-radius:4px;
      border:none;
      font-size:16px;
      box-sizing: border-box;
    }
    button { cursor:pointer; background:#2d7dd2; color:white; }
    button:hover { background:#3689e6; }
    .row { display:flex; gap:15px; flex-wrap:wrap; }
    .col { flex:1; min-width:150px; }

    .back-button {
        background: #555;
        margin-bottom: 20px;
    }
    .back-button:hover {
        background: #777;
    }

    /* PIN Modal */
    #pinModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    #pinModalContent {
      background: #333;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    #pinModalContent h2 {
      margin-top: 0;
    }
    #pinModalContent input {
      text-align: center;
      font-size: 24px;
      letter-spacing: 5px;
    }
    #pinModalContent .error {
      color: #ff6b6b;
      margin-top: 10px;
    }
  </style>
</head>
<body>
<div id="pinModal">
  <div id="pinModalContent">
    <h2 id="pinModalTitle">Enter PIN</h2>
    <p id="pinModalMessage">Enter the 4-digit PIN to control the scoreboard</p>
    <input type="password" id="pinInput" maxlength="4" placeholder="----">
    <button onclick="verifyPin()">Submit</button>
    <p id="pinError" class="error"></p>
  </div>
</div>

<button class="back-button" onclick="window.location.href='/control_panel'">Back to Control Panel</button>
<h1>VolleyScore Formations Control</h1>

<div class="section">
  <label>Formations (Starting Six)</label>
  <div class="row">
    <div class="col">
      <label>Home Players (1-6)</label>
      <input type="text" id="homeP1" placeholder="Pos 1">
      <input type="text" id="homeP2" placeholder="Pos 2">
      <input type="text" id="homeP3" placeholder="Pos 3">
      <input type="text" id="homeP4" placeholder="Pos 4">
      <input type="text" id="homeP5" placeholder="Pos 5">
      <input type="text" id="homeP6" placeholder="Pos 6">
    </div>
    <div class="col">
      <label>Away Players (1-6)</label>
      <input type="text" id="awayP1" placeholder="Pos 1">
      <input type="text" id="awayP2" placeholder="Pos 2">
      <input type="text" id="awayP3" placeholder="Pos 3">
      <input type="text" id="awayP4" placeholder="Pos 4">
      <input type="text" id="awayP5" placeholder="Pos 5">
      <input type="text" id="awayP6" placeholder="Pos 6">
    </div>
  </div>
</div>

<div class="section">
    <button onclick="sendToServer()">Update Formations</button>
  </div>

  <div class="section">
    <button onclick="window.location.href='/control_panel_unified'" style="background:#555;">Switch to Unified Control Panel</button>
  </div>

<div class="section" id="status">Status: Ready</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.0/socket.io.js"></script>
<script>
  const PIN_STORAGE_KEY = 'volleyScorePin';

  let serverPin = "";
  let isAuthenticated = false;

  const socket = io();

  socket.on('connect', () => {
      console.log('Connected to WebSocket');
  });

  socket.on('score_update', (data) => {
      console.log('Score update received:', data);

      // Check if PIN changed on server
      if (data.pin && data.pin !== serverPin) {
          serverPin = data.pin;
          const storedPin = localStorage.getItem(PIN_STORAGE_KEY);
          if (storedPin !== serverPin) {
              isAuthenticated = false;
              document.getElementById("pinModal").style.display = "flex";
              document.getElementById("pinModalTitle").textContent = "Enter PIN";
              document.getElementById("pinModalMessage").textContent = "Enter the 4-digit PIN to control the scoreboard";
          }
      }

      restoreState(data);
  });

  window.addEventListener("load", async () => {
    try {
        const response = await fetch('/current');
        const currentState = await response.json();
        serverPin = currentState.pin || "";

        // Check localStorage for saved PIN
        const storedPin = localStorage.getItem(PIN_STORAGE_KEY);

        if (serverPin) {
            if (storedPin === serverPin) {
                isAuthenticated = true;
            } else {
                document.getElementById("pinModal").style.display = "flex";
                document.getElementById("pinModalTitle").textContent = "Enter PIN";
                document.getElementById("pinModalMessage").textContent = "Enter the 4-digit PIN to control the scoreboard";
            }
        } else {
            isAuthenticated = true;
        }

        restoreState(currentState);
    } catch (e) {
        console.error("Failed to fetch initial state from server", e);
    }
  });

  function verifyPin() {
    const input = document.getElementById("pinInput").value;

    if (input === serverPin) {
        isAuthenticated = true;
        document.getElementById("pinModal").style.display = "none";
        document.getElementById("pinError").textContent = "";
        localStorage.setItem(PIN_STORAGE_KEY, input);
    } else {
        document.getElementById("pinError").textContent = "Incorrect PIN";
        document.getElementById("pinInput").value = "";
    }
  }

  document.getElementById("pinInput").addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
        verifyPin();
    }
  });

  function restoreState(state) {
    for(let i=1; i<=6; i++) {
        if(state.homePlayers) document.getElementById("homeP"+i).value = state.homePlayers[i-1] || "";
        if(state.awayPlayers) document.getElementById("awayP"+i).value = state.awayPlayers[i-1] || "";
    }
  }

  async function sendToServer() {
    if (!isAuthenticated) {
        alert("Please enter the PIN first");
        return;
    }

    const formData = new FormData();

    for(let i=1; i<=6; i++) {
        formData.append("homeP"+i, document.getElementById("homeP"+i).value);
        formData.append("awayP"+i, document.getElementById("awayP"+i).value);
    }

    // Append PIN if set
    if (serverPin) {
        formData.append("pin", serverPin);
    }

    // Append other necessary fields
    formData.append("awayName", "");
    formData.append("homeName", "");
    formData.append("awayScore", "0");
    formData.append("homeScore", "0");
    formData.append("homeSets", "0");
    formData.append("awaySets", "0");
    formData.append("possession", "none");
    formData.append("awayLogo", "");
    formData.append("homeLogo", "");
    formData.append("previousSetScores", "[]");
    formData.append("awayColorPrimary", "");
    formData.append("awayColorSecondary", "");
    formData.append("homeColorPrimary", "");
    formData.append("homeColorSecondary", "");
    formData.append("matchTitle", "");

    try {
        let res = await fetch("/update", {
            method: "POST",
            body: formData
        });
        let result = await res.json();

        if (result.status === "error") {
            document.getElementById("status").textContent = "Status: " + result.message;
            alert(result.message);
            return;
        }

        document.getElementById("status").textContent = "Status: " + (result.status || "OK");

    } catch (err) {
        console.error(err);
        document.getElementById("status").textContent = "Status: Error";
    }
  }
</script>
</body>
</html>
