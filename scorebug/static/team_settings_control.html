<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VolleyScore Team Settings</title>
  <style>
    body { font-family: Arial, sans-serif; background:#222; color:#fff; padding:15px; margin: 0; }
    h1 { text-align:center; font-size: 1.5rem; }
    .section { margin-bottom:20px; padding:10px; background:#333; border-radius:6px; }
    label { display:block; margin-bottom:5px; color:#ccc; }
    input[type="text"], input[type="number"], button, input[type="color"] {
      width:100%;
      padding:10px;
      margin-bottom:10px;
      border-radius:4px;
      border:none;
      font-size:16px;
      box-sizing: border-box;
    }
    button { cursor:pointer; background:#2d7dd2; color:white; }
    button:hover { background:#3689e6; }
    .row { display:flex; gap:15px; flex-wrap:wrap; }
    .col { flex:1; min-width:150px; }

    /* Color picker specific styling */
    input[type="color"] {
        height: 40px; /* Adjust height to match other inputs */
        padding: 0;
        border: 1px solid #555;
    }

    .back-button {
        background: #555;
        margin-bottom: 20px;
    }
    .back-button:hover {
        background: #777;
    }
  </style>
</head>
<body>
<button class="back-button" onclick="window.location.href='/control_panel'">Back to Control Panel</button>
<h1>VolleyScore Team Settings</h1>

<div class="section">
  <div class="row">
    <div class="col">
      <label for="homeName">Home Team Name</label>
      <input type="text" id="homeName" value="Home">
      <label for="homeLogoFile">Upload Home Logo</label>
      <input type="file" id="homeLogoFile" accept="image/*">
      <input type="hidden" id="homeLogo" value="/static/home_logo_placeholder.jpg">
      <label for="homeColorPrimary">Home Primary Color</label>
      <input type="color" id="homeColorPrimary" value="#0000FF">
      <label for="homeColorSecondary">Home Secondary Color</label>
      <input type="color" id="homeColorSecondary" value="#AAAAFF">
    </div>
    <div class="col">
      <label for="awayName">Away Team Name</label>
      <input type="text" id="awayName" value="Away">
      <label for="awayLogoFile">Upload Away Logo (PNG/JPG)</label>
      <input type="file" id="awayLogoFile" accept="image/*">
      <input type="hidden" id="awayLogo" value="/static/away_logo.jpg">
      <label for="awayColorPrimary">Away Primary Color</label>
      <input type="color" id="awayColorPrimary" value="#FF0000">
      <label for="awayColorSecondary">Away Secondary Color</label>
      <input type="color" id="awayColorSecondary" value="#FFAAAA">
    </div>
  </div>
</div>

<div class="section">
  <button onclick="sendToServer()">Update Team Settings</button>
</div>

<div class="section" id="status">Status: Ready</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.0/socket.io.js"></script>
<script>
  const socket = io();

  socket.on('connect', () => {
      console.log('Connected to WebSocket');
  });

  socket.on('score_update', (data) => {
      console.log('Score update received:', data);
      restoreState(data);
  });

  window.addEventListener("load", async () => {
    try {
        const response = await fetch('/current');
        const currentState = await response.json();
        restoreState(currentState);
    } catch (e) {
        console.error("Failed to fetch initial state from server", e);
    }
  });

  function restoreState(state) {
    document.getElementById("awayName").value = state.awayName || "Away";
    document.getElementById("homeName").value = state.homeName || "Home";

    if (state.homeLogo) {
        document.getElementById("homeLogo").value = state.homeLogo;
    }
    if (state.awayLogo) {
        document.getElementById("awayLogo").value = state.awayLogo;
    }

    document.getElementById("awayColorPrimary").value = state.awayColorPrimary || "#FF0000";
    document.getElementById("awayColorSecondary").value = state.awayColorSecondary || "#FFAAAA";
    document.getElementById("homeColorPrimary").value = state.homeColorPrimary || "#0000FF";
    document.getElementById("homeColorSecondary").value = state.homeColorSecondary || "#AAAAFF";
  }

  async function sendToServer() {
    const logoFile = document.getElementById("awayLogoFile").files[0];
    const homeLogoFile = document.getElementById("homeLogoFile").files[0];

    const formData = new FormData();

    formData.append("awayName", document.getElementById("awayName").value);
    formData.append("homeName", document.getElementById("homeName").value);

    // Append color values
    formData.append("awayColorPrimary", document.getElementById("awayColorPrimary").value);
    formData.append("awayColorSecondary", document.getElementById("awayColorSecondary").value);
    formData.append("homeColorPrimary", document.getElementById("homeColorPrimary").value);
    formData.append("homeColorSecondary", document.getElementById("homeColorSecondary").value);

    if (logoFile) {
        formData.append("awayLogoFile", logoFile);
    } else {
         formData.append("awayLogo", document.getElementById("awayLogo").value);
    }

    if (homeLogoFile) {
        formData.append("homeLogoFile", homeLogoFile);
    } else {
        formData.append("homeLogo", document.getElementById("homeLogo").value);
    }

    // Append other necessary fields to ensure the server update function works correctly
    // These values will be ignored by the server if they are empty, but need to be present
    formData.append("awayScore", "0");
    formData.append("homeScore", "0");
    formData.append("homeSets", "0");
    formData.append("awaySets", "0");
    formData.append("possession", "none");
    formData.append("homePlayers", JSON.stringify(["", "", "", "", "", ""]));
    formData.append("awayPlayers", JSON.stringify(["", "", "", "", "", ""]));
    formData.append("previousSetScores", "[]");

    try {
        let res = await fetch("/update", {
            method: "POST",
            body: formData
        });
        let result = await res.json();

        if (result.newLogoUrl) {
            document.getElementById("awayLogo").value = result.newLogoUrl;
            document.getElementById("awayLogoFile").value = "";
        }
        if (result.newHomeLogoUrl) {
            document.getElementById("homeLogo").value = result.newHomeLogoUrl;
            document.getElementById("homeLogoFile").value = "";
        }

        document.getElementById("status").textContent = "Status: " + (result.status || "OK");

    } catch (err) {
        console.error(err);
        document.getElementById("status").textContent = "Status: Error";
    }
  }
</script>
</body>
</html>
