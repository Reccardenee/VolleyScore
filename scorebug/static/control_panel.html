<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VolleyScore Control Panel</title>
  <style>
    body { font-family: Arial, sans-serif; background:#222; color:#fff; padding:15px; margin: 0; }
    h1 { text-align:center; font-size: 1.5rem; }
    .section { margin-bottom:20px; padding:10px; background:#333; border-radius:6px; }
    label { display:block; margin-bottom:5px; color:#ccc; }
    input[type="text"], input[type="number"], button {
      width:100%;
      padding:10px;
      margin-bottom:10px;
      border-radius:4px;
      border:none;
      font-size:16px;
      box-sizing: border-box;
    }
    button { cursor:pointer; background:#2d7dd2; color:white; }
    button:hover { background:#3689e6; }
    .row { display:flex; gap:15px; flex-wrap:wrap; }
    .col { flex:1; min-width:150px; }

    /* Specific CSS to remove number input arrows (spinners) */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield; /* Firefox */
      text-align: center;
    }

    /* Styling for the score/set control row */
    .score-control-row {
      display: flex;
      gap: 5px;
      margin-bottom: 15px;
    }
    .score-control-row button {
      width: 40px;
      flex-shrink: 0;
      padding: 10px 0;
      margin-bottom: 0;
    }
    .score-control-row input {
      margin-bottom: 0;
    }

    /* QR Code Styling */
    .qr-code-container {
        text-align: center;
        margin-top: 20px;
    }
    .qr-code-container img {
        width: 200px; /* Adjust size as needed */
        height: 200px;
        border: 5px solid white;
        border-radius: 5px;
    }

    /* Responsive adjustments for mobile */
    @media (max-width: 600px) {
      .col {
        flex: 1 1 100%; /* Force columns to take full width on small screens */
      }
      .score-control-row button {
        width: 60px; /* Larger buttons for easier tapping on mobile */
        height: 50px;
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
<h1>VolleyScore Control Panel</h1>

<div class="section">
  <div class="row">
    <div class="col">
      <label for="homeScore">Home Score (Points)</label>
      <div class="score-control-row">
        <button onclick="changeScore('home', -1)">−</button>
        <input type="number" id="homeScore" value="0">
        <button onclick="changeScore('home', 1)">+</button>
      </div>

      <label for="homeSets">Home Sets Won</label>
      <div class="score-control-row">
        <button onclick="changeSet('home', -1)">−</button>
        <input type="number" id="homeSets" value="0">
        <button onclick="changeSet('home', 1)">+</button>
      </div>
    </div>

    <div class="col">
      <label for="awayScore">Away Score (Points)</label>
      <div class="score-control-row">
        <button onclick="changeScore('away', -1)">−</button>
        <input type="number" id="awayScore" value="0">
        <button onclick="changeScore('away', 1)">+</button>
      </div>

      <label for="awaySets">Away Sets Won</label>
      <div class="score-control-row">
        <button onclick="changeSet('away', -1)">−</button>
        <input type="number" id="awaySets" value="0">
        <button onclick="changeSet('away', 1)">+</button>
      </div>
    </div>
  </div>
</div>

<div class="section">
    <h2>Previous Set Scores</h2>
    <div id="previousSetScoresContainer">
        <!-- Previous set scores will be added here dynamically -->
        <p>No sets completed yet.</p>
    </div>
    <button onclick="addPreviousSetScore()">Add Set Score</button>
</div>

<div class="section">
  <label>Possession (Service)</label>
  <div class="row">
    <button onclick="setPossession('home')">Home</button>
    <button onclick="setPossession('none')">None</button>
    <button onclick="setPossession('away')">Away</button>
  </div>
</div>

<div class="section">
  <button onclick="sendToServer()">Update OBS</button>
</div>

<div class="section" id="status">Status: Ready</div>

<div class="section">
  <button onclick="resetGame()">Reset Game</button>
</div>

<div class="section">
    <h2>Other Controls</h2>
    <button onclick="window.location.href='/team_settings_control'">Manage Team Settings</button>
    <button onclick="window.location.href='/formations_control'">Manage Formations</button>
</div>

<div class="section qr-code-container">
    <h2>Remote Access (Scan QR for Control Panel)</h2>
    <img src="/qrcode_image" alt="QR Code for Control Panel" />
    <p>Scan this QR code with your phone to access the control panel remotely.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.0/socket.io.js"></script>
<script>
  let possession = "none";
  let homeSets = 0;
  let awaySets = 0;

  const socket = io();

  socket.on('connect', () => {
      console.log('Connected to WebSocket');
  });

  socket.on('score_update', (data) => {
      console.log('Score update received:', data);
      restoreState(data);
  });

  window.addEventListener("load", async () => {
    // Fetch initial state from server
    try {
        const response = await fetch('/current');
        const currentState = await response.json();
        restoreState(currentState);
    } catch (e) {
        console.error("Failed to fetch initial state from server", e);
    }
  });

  function restoreState(state) {
    // Only restore score and sets, as other fields are on different pages
    document.getElementById("awayScore").value = state.awayScore || 0;
    document.getElementById("homeScore").value = state.homeScore || 0;
    document.getElementById("homeSets").value = state.homeSets || 0;
    document.getElementById("awaySets").value = state.awaySets || 0;
    homeSets = parseInt(state.homeSets, 10) || 0;
    awaySets = parseInt(state.awaySets, 10) || 0;
    possession = state.possession || "none";

    updatePreviousSetScoresUI(state.previousSetScores || []);
  }

  function updatePreviousSetScoresUI(scores) {
    const container = document.getElementById("previousSetScoresContainer");
    container.innerHTML = ''; // Clear existing entries

    if (scores.length === 0) {
        container.innerHTML = '<p>No sets completed yet.</p>';
        return;
    }

    scores.forEach((set, index) => {
        const div = document.createElement('div');
        div.style.display = 'flex';
        div.style.gap = '5px';
        div.style.marginBottom = '5px';
        div.innerHTML = `
            <label>Set ${index + 1}:</label>
            <input type="number" value="${set.home}" style="width: 60px;" data-set-index="${index}" data-team="home" onchange="updatePreviousSetScore(this)">
            -
            <input type="number" value="${set.away}" style="width: 60px;" data-set-index="${index}" data-team="away" onchange="updatePreviousSetScore(this)">
            <button onclick="removePreviousSetScore(${index})" style="width: auto; padding: 5px 10px; margin-bottom: 0; background: #d9534f;">Remove</button>
        `;
        container.appendChild(div);
    });
  }

  function addPreviousSetScore() {
    const currentScores = getCurrentPreviousSetScores();
    currentScores.push({ home: 0, away: 0 });
    updatePreviousSetScoresUI(currentScores);
    sendToServer();
  }

  function updatePreviousSetScore(inputElement) {
    const index = parseInt(inputElement.dataset.setIndex);
    const team = inputElement.dataset.team;
    const value = parseInt(inputElement.value) || 0;

    const currentScores = getCurrentPreviousSetScores();
    if (currentScores[index]) {
        currentScores[index][team] = value;
    }
    sendToServer();
  }

  function removePreviousSetScore(index) {
    const currentScores = getCurrentPreviousSetScores();
    currentScores.splice(index, 1);
    updatePreviousSetScoresUI(currentScores);
    sendToServer();
  }

  function getCurrentPreviousSetScores() {
    const container = document.getElementById("previousSetScoresContainer");
    const inputs = container.querySelectorAll('input[type="number"]');
    const scores = [];
    let tempSet = {};
    inputs.forEach((input, idx) => {
        if (idx % 2 === 0) { // Home score
            tempSet = { home: parseInt(input.value) || 0 };
        } else { // Away score
            tempSet.away = parseInt(input.value) || 0;
            scores.push(tempSet);
        }
    });
    return scores;
  }

  async function sendToServer() {
    const formData = new FormData();

    // Only append fields managed by this control panel
    formData.append("awayScore", document.getElementById("awayScore").value);
    formData.append("homeScore", document.getElementById("homeScore").value);
    formData.append("homeSets", document.getElementById("homeSets").value);
    formData.append("awaySets", document.getElementById("awaySets").value);
    formData.append("possession", possession);
    formData.append("previousSetScores", JSON.stringify(getCurrentPreviousSetScores()));

    // Append placeholders for other fields that are now on different pages
    // The server's update function expects all fields, even if they are empty strings.
    formData.append("awayName", "");
    formData.append("homeName", "");
    formData.append("awayLogo", "");
    formData.append("homeLogo", "");
    formData.append("homePlayers", JSON.stringify(["", "", "", "", "", ""]));
    formData.append("awayPlayers", JSON.stringify(["", "", "", "", "", ""]));
    formData.append("awayColorPrimary", "");
    formData.append("awayColorSecondary", "");
    formData.append("homeColorPrimary", "");
    formData.append("homeColorSecondary", "");

    try {
        let res = await fetch("/update", {
            method: "POST",
            body: formData
        });
        let result = await res.json();

        document.getElementById("status").textContent = "Status: " + (result.status || "OK");

    } catch (err) {
        console.error(err);
        document.getElementById("status").textContent = "Status: Error";
    }
  }

  function changeSet(team, delta) {
    const setInput = document.getElementById(team + "Sets");
    let newSetCount = Math.max(0, parseInt(setInput.value, 10) + delta);
    setInput.value = newSetCount;

    if (team === 'home') homeSets = newSetCount;
    if (team === 'away') awaySets = newSetCount;

    sendToServer();
  }

  function changeScore(team, delta) {
    const input = document.getElementById(team + "Score");
    const otherTeam = team === 'home' ? 'away' : 'home';
    const otherInput = document.getElementById(otherTeam + "Score");

    let newScore = Math.max(0, parseInt(input.value, 10) + delta);
    let otherScore = parseInt(otherInput.value, 10);

    input.value = newScore;

    if (delta > 0) {
      possession = team;
      sendToServer();
    } else {
      sendToServer();
    }
  }

  function resetGame() {
    document.getElementById("awayScore").value = 0;
    document.getElementById("homeScore").value = 0;
    document.getElementById("awaySets").value = 0;
    document.getElementById("homeSets").value = 0;
    homeSets = 0;
    awaySets = 0;
    possession = "none";
    // Clear previous set scores
    updatePreviousSetScoresUI([]);
    sendToServer();
  }
</script>
</body>
</html>
