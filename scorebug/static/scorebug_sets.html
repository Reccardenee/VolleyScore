<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VolleyScore - All Sets</title>
<link rel="icon" type="image/x-icon" href="/static/icon.ico">

<!-- Fonts: Used for the bold team names and scores -->
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">
<!-- Icons: Using Lucide Icons for the service indicator -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<!-- Socket.IO Client -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<style>
/* Define the primary colors from the image (Dark Blue, Red, Yellow/Gold) */
:root {
 --primary-blue: #142850;   /* Dark Navy Blue - Primary background */
 --secondary-blue: #0a1f3c; /* Slightly darker blue for gradient bottom */
 --accent-red: #D83A56;     /* Bright Red - Home team accent/color bar */
 --accent-gold: #F0A500;    /* Gold/Yellow - Away team accent/Sets column */
 --secondary-gold: #B87B00;
 --dark-background: #333;
 --subtle-border-color: #2a406b;

 /* Dynamic Colors - Default values */
 --home-primary-color: #0000FF;
 --home-secondary-color: #AAAAFF;
 --away-primary-color: #FF0000;
 --away-secondary-color: #FFAAAA;
}

/* --- GENERAL BODY --- */
body {
 background: rgba(0,0,0,0); /* Transparent for OBS */
 margin: 0;
 padding: 20px;
 display: flex;
 flex-direction: column;
 justify-content: center;
 align-items: center;
 min-height: 100vh;
 font-family: Arial, sans-serif;
 box-sizing: border-box;
}

.containervolley {
  width: fit-content;
  min-width: 1000px;
  display: grid;
  grid-template-columns: 150px auto 70px 90px 90px 90px 90px 90px;
  grid-template-rows: auto auto auto; /* Header + Home + Away */
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  margin-bottom: 10px; /* Space for previous set scores */
}

/* --- HEADER ROW (Labels like SETS, POINTS) --- */
.boxheader-sets {
  background: linear-gradient(to bottom, var(--accent-gold), var(--secondary-gold));
  color: var(--primary-blue);
  font-family: "Alfa Slab One", cursive;
  font-size: 22px;
  text-align: center;
  font-weight: bold;
  letter-spacing: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 1px solid var(--subtle-border-color);
}



.boxheader-service {
  background: linear-gradient(to bottom, var(--primary-blue), var(--secondary-blue));
  border-bottom: 1px solid var(--subtle-border-color);
}

.header-empty {
  background: linear-gradient(to bottom, var(--primary-blue), var(--secondary-blue));
  border-bottom: 1px solid var(--subtle-border-color);
}

/* --- TITLE IN HEADER ROW --- */
.boxheader-title {
  background: linear-gradient(to bottom, var(--primary-blue), var(--secondary-blue));
  color: white;
  font-family: "Alfa Slab One", cursive;
  font-size: 22px;
  text-align: center;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 1px solid var(--subtle-border-color);
  position: relative;
}

/* --- LOGO COLUMN (SPLIT) --- */
.home-logo-container, .away-logo-container {
    grid-column: 1 / 2;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    /* Apply vertical gradient to logo column background */
    background: linear-gradient(to bottom, var(--primary-blue), var(--secondary-blue));
}

.home-logo-container { grid-row: 2 / 3; }
.away-logo-container { grid-row: 3 / 4; }

/* Placeholder Divs for the actual images */
.home-logo-placeholder, .away-logo-placeholder {
    width: 80%;
    height: 90%;
    border-radius: 15px;
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    background-image: url('/static/home_logo_placeholder.jpg');
}

/* Vertical Color Bar (Applied as a pseudo-element on the last element of the column) */
.home-logo-container::after {
  content: "";
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  width: 15px;
  background: var(--home-primary-color); /* Dynamic home primary color */
  z-index: 5;
}

.away-logo-container::after {
  content: "";
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  width: 15px;
  background: var(--away-primary-color); /* Dynamic away primary color */
  z-index: 5;
}


/* --- TEAM NAMES --- */
.boxhometeam, .boxawayteam {
 text-align: left;
 display: flex;
 align-items: center;
 padding: 10px 15px 10px 25px;
 font-family: "Alfa Slab One", cursive;
 font-size: 50px;
 color: white;
 position: relative;
 background: linear-gradient(to bottom, var(--primary-blue), var(--secondary-blue));
 white-space: nowrap;
}

.boxhometeam { grid-row: 2 / 3; grid-column: 2 / 3; }
.boxawayteam { grid-row: 3 / 4; grid-column: 2 / 3; }

/* General appearance for boxes */
.box {
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

/* Row Separator */
.home-logo-container, .boxhometeam, .boxhomeservice, .boxhomesets, .boxhomepoints {
 border-bottom: 1px solid var(--subtle-border-color);
}

/* --- SETS --- */
.boxhomesets, .boxawaysets {
  font-weight: bold;
  font-size: 70px;
  font-family: "Alfa Slab One", cursive;
  position: relative;
  overflow: hidden;
  border-left: 1px solid rgba(255,255,255,0.08);
}

/* Set columns - Alternating Orange (odd) and Blue (even) */
#home_set_1, #away_set_1,
#home_set_3, #away_set_3,
#home_set_5, #away_set_5 {
  background: linear-gradient(to bottom, var(--accent-gold), var(--secondary-gold));
  color: var(--primary-blue);
}

#home_set_2, #away_set_2,
#home_set_4, #away_set_4 {
  background: linear-gradient(to bottom, var(--primary-blue), var(--secondary-blue));
  color: white;
}

/* Set headers - alternating colors */
.boxheader-sets:nth-child(3),
.boxheader-sets:nth-child(5),
.boxheader-sets:nth-child(7),
.boxheader-sets:nth-child(9) {
  background: linear-gradient(to bottom, var(--accent-gold), var(--secondary-gold));
  color: var(--primary-blue);
}

.boxheader-sets:nth-child(4),
.boxheader-sets:nth-child(6),
.boxheader-sets:nth-child(8) {
  background: linear-gradient(to bottom, var(--primary-blue), var(--secondary-blue));
  color: white;
}

/* Score animation number styling */
.score-anim-number {
    display: block;
    position: absolute;
    width: 100%;
    height: 100%; /* Take full height of parent */
    top: 0;
    left: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s ease-out; /* Smooth slide animation */
}

/* --- SERVICE INDICATORS --- */
.boxservice {
  position: relative;
  background: linear-gradient(to bottom, var(--primary-blue), var(--secondary-blue));
}
.service-icon {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  height: 100%;
  transition: opacity 0.3s;
}
.service-icon svg {
  width: 45px;
  height: 45px;
  color: white;
}
.okservice { opacity: 1; }
.noservice { opacity: 0; }

/* Row Separator */
.home-logo-container, .boxhometeam, .boxhomeservice, .boxhomesets {
  border-bottom: 1px solid var(--subtle-border-color);
}

#scoreboard {
  transition: opacity 0.4s ease, transform 0.4s ease;
}
#scoreboard.hidden {
  opacity: 0;
  transform: translateY(10px);
  pointer-events: none;
}

</style>
</head>

<body>
 <section id="scoreboard">
  <div class="containervolley">
      <!-- Header Row -->
   <div class="box boxheader-title" style="grid-column: 1 / 3;" id="matchTitle">
     Volleyball Match
   </div>
   <div class="box boxheader-service"></div>

   <div class="box boxheader-sets">Set 1</div>
   <div class="box boxheader-sets">Set 2</div>
   <div class="box boxheader-sets">Set 3</div>
   <div class="box boxheader-sets">Set 4</div>
<div class="box boxheader-sets">Set 5</div>

    <!-- Home Logo Column (Row 1, Column 1) -->
   <div class="home-logo-container">
     <div class="home-logo-placeholder"></div>
   </div>

   <!-- Home Team (Row 1) -->
   <div class="box boxhometeam" id="team_1">Ribera Volley</div>
   <div class="box boxservice boxhomeservice">
    <span id="homeservice" class="service-icon noservice">
     <i data-lucide="volleyball"></i>
    </span>
   </div>
   <div class="box numbers boxhomesets" id="home_set_1"><span class="score-anim-number is-current">0</span></div>
   <div class="box numbers boxhomesets" id="home_set_2"><span class="score-anim-number is-current">0</span></div>
   <div class="box numbers boxhomesets" id="home_set_3"><span class="score-anim-number is-current">0</span></div>
   <div class="box numbers boxhomesets" id="home_set_4"><span class="score-anim-number is-current">0</span></div>
<div class="box numbers boxhomesets" id="home_set_5"><span class="score-anim-number is-current">0</span></div>

    <!-- Away Logo Column (Row 2, Column 1) -->
    <div class="away-logo-container">
     <div class="away-logo-placeholder"></div>
   </div>

   <!-- Away Team (Row 2) -->
   <div class="box boxawayteam" id="team_2">Sciacca</div>
   <div class="box boxservice boxawayservice">
    <span id="awayservice" class="service-icon noservice">
     <i data-lucide="volleyball"></i>
    </span>
   </div>
   <div class="box numbers boxawaysets" id="away_set_1"><span class="score-anim-number is-current">0</span></div>
   <div class="box numbers boxawaysets" id="away_set_2"><span class="score-anim-number is-current">0</span></div>
   <div class="box numbers boxawaysets" id="away_set_3"><span class="score-anim-number is-current">0</span></div>
   <div class="box numbers boxawaysets" id="away_set_4"><span class="score-anim-number is-current">0</span></div>
<div class="box numbers boxawaysets" id="away_set_5"><span class="score-anim-number is-current">0</span></div>

</div>
  </section>

  <script>
// Initialize Lucide icons once when the window loads
window.onload = function() {
  lucide.createIcons();
};

const socket = io();
let previousState = {};

socket.on('score_update', function(data) {
    updateUI(data);
});

function animateScoreChange(elementId, newValue) {
    const element = document.getElementById(elementId);
    let currentSpan = element.querySelector('.score-anim-number.is-current');

    // If no currentSpan (initial load), create one
    if (!currentSpan) {
        currentSpan = document.createElement('span');
        currentSpan.className = 'score-anim-number is-current';
        currentSpan.textContent = newValue;
        element.appendChild(currentSpan);
        return;
    }

    const oldValue = parseInt(currentSpan.textContent);
    if (oldValue === newValue) return;

    // Remove any old, non-current spans that might be lingering from previous rapid updates
    element.querySelectorAll('.score-anim-number:not(.is-current)').forEach(span => span.remove());

    // Create the new span
    const newSpan = document.createElement('span');
    newSpan.className = 'score-anim-number';
    newSpan.textContent = newValue;

    // Determine direction and initial positions
    const direction = newValue > oldValue ? 'up' : 'down';
    newSpan.style.transform = direction === 'up' ? 'translateY(100%)' : 'translateY(-100%)';

    // Append new span
    element.appendChild(newSpan);

    // Force reflow to apply initial transform before transition
    void newSpan.offsetWidth;

    // Start the animation
    currentSpan.style.transform = direction === 'up' ? 'translateY(-100%)' : 'translateY(100%)';
    newSpan.style.transform = 'translateY(0)';

    // Remove 'is-current' from the old span and add to the new one
    currentSpan.classList.remove('is-current');
    newSpan.classList.add('is-current');

    // Clean up the old span after its transition
    currentSpan.addEventListener('transitionend', () => {
        currentSpan.remove();
    }, { once: true });
}


function updateUI(data) {
    // Update match title
    if (data.matchTitle !== previousState.matchTitle) {
        document.getElementById("matchTitle").childNodes[0].textContent = data.matchTitle || "Volleyball Match";
    }

    // Update team names
    if (data.homeName !== previousState.homeName) document.getElementById("team_1").textContent = data.homeName;
    if (data.awayName !== previousState.awayName) document.getElementById("team_2").textContent = data.awayName;

    // Scores are now handled in the set columns update below

    // Update set scores - update all 5 set columns based on currentSet
    const currentSet = data.currentSet || 1;
    const previousSetScores = data.previousSetScores || [];
    const homeLiveScore = data.homeScore || 0;
    const awayLiveScore = data.awayScore || 0;
    
    for (let i = 0; i < 5; i++) {
        const setIndex = i + 1;
        const homeSetCell = document.getElementById(`home_set_${setIndex}`);
        const awaySetCell = document.getElementById(`away_set_${setIndex}`);
        
        if (!homeSetCell || !awaySetCell) continue;
        
        const homeScoreSpan = homeSetCell.querySelector('.score-anim-number.is-current');
        const awayScoreSpan = awaySetCell.querySelector('.score-anim-number.is-current');
        if (!homeScoreSpan || !awayScoreSpan) continue;
        
        let homeValue, awayValue;
        
        const setData = previousSetScores[setIndex - 1];
        if (setData) {
            // Completed set - show the recorded final score
            homeValue = setData.home;
            awayValue = setData.away;
        } else if (setIndex === currentSet) {
            // Current set being played - show live score
            homeValue = homeLiveScore;
            awayValue = awayLiveScore;
        } else {
            // Future set not yet played
            homeValue = 0;
            awayValue = 0;
        }
        
        // Update with animation if changed
        if (homeScoreSpan.textContent != homeValue) {
            animateScoreChange(`home_set_${setIndex}`, homeValue);
        }
        if (awayScoreSpan.textContent != awayValue) {
            animateScoreChange(`away_set_${setIndex}`, awayValue);
        }
    }

    // Update logos
    if (data.awayLogo !== previousState.awayLogo) {
        const awayLogoPlaceholder = document.querySelector('.away-logo-placeholder');
        if (data.awayLogo) {
            awayLogoPlaceholder.style.backgroundImage = `url('${data.awayLogo}')`;
        }
    }

    if (data.homeLogo !== previousState.homeLogo) {
        const homeLogoPlaceholder = document.querySelector('.home-logo-placeholder');
        if (data.homeLogo) {
            homeLogoPlaceholder.style.backgroundImage = `url('${data.homeLogo}')`;
        }
    }

    // Update possession indicator
    if (data.possession !== previousState.possession) {
        const homeServiceSpan = document.getElementById("homeservice");
        const awayServiceSpan = document.getElementById("awayservice");

        const toggleService = (element, isServing) => {
            element.classList.toggle('okservice', isServing);
            element.classList.toggle('noservice', !isServing);
        };

        if (data.possession === "home") {
            toggleService(homeServiceSpan, true);
            toggleService(awayServiceSpan, false);
        } else if (data.possession === "away") {
            toggleService(homeServiceSpan, false);
            toggleService(awayServiceSpan, true);
        } else {
            toggleService(homeServiceSpan, false);
            toggleService(awayServiceSpan, false);
        }
    }

    // Update dynamic colors
    const root = document.documentElement;
    root.style.setProperty('--home-primary-color', data.homeColorPrimary);
    root.style.setProperty('--home-secondary-color', data.homeColorSecondary);
    root.style.setProperty('--away-primary-color', data.awayColorPrimary);
    root.style.setProperty('--away-secondary-color', data.awayColorSecondary);

    // Overlay theme (same non-team palette)
    root.style.setProperty('--primary-blue', data.themeBgPrimary || '#142850');
    root.style.setProperty('--secondary-blue', data.themeBgSecondary || '#0a1f3c');
    root.style.setProperty('--accent-gold', data.themeAccent || '#F0A500');
    root.style.setProperty('--secondary-gold', data.themeAccentSecondary || '#B87B00');
    root.style.setProperty('--subtle-border-color', data.themeBorder || '#2a406b');

    // Per-overlay visibility (the sets overlay can be toggled from the panel)
    const sb = document.getElementById('scoreboard');
    const vis = data.overlayVisibility || {};
    if (sb) sb.classList.toggle('hidden', !vis.scorebug_sets);

    previousState = data;
}

// Initial load of data (if any)
socket.on('connect', () => {
    console.log('Connected to WebSocket');
    fetch('/current').then(r => r.json()).then(data => {
        updateUI(data);
    });
});

</script>
</body>
</html>
